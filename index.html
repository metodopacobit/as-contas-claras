<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0f766e"
  >

  <title>As contas claras</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    header {
      background: #0f766e;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .mes {
      background: white;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    input,
    select,
    button {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tarjeta {
      background: white;
      border-radius: 14px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .tarjeta strong {
      display: block;
      font-size: 21px;
      margin-top: 6px;
    }

    .ingresos strong {
      color: #15803d;
    }

    .gastos strong {
      color: #dc2626;
    }

    .saldo {
      grid-column: span 2;
    }

    .saldo strong {
      color: #0f766e;
      font-size: 27px;
    }

    .saldo-negativo strong {
      color: #dc2626;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .panel h2 {
      margin-top: 0;
      margin-bottom: 18px;
    }

    .btn {
      background: #0f766e;
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 18px;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .positivo {
      color: #15803d;
    }

    .negativo {
      color: #dc2626;
    }

    .neutro {
      color: #6b7280;
    }

    .oculto {
      display: none;
    }

    .fila-resumen {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;

      padding: 11px 0;

      border-bottom:
        1px solid #eeeeee;
    }

    .fila-resumen:last-child {
      border-bottom: none;
    }

    .fila-resumen strong {
      flex: 1;
    }

    .importe-resumen {
      text-align: right;
      white-space: nowrap;
    }

    .movimiento {
      border-bottom:
        1px solid #e5e7eb;

      padding: 13px 0;
    }

    .movimiento:last-child {
      border-bottom: none;
    }

    .mov-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .mov-top span:first-child {
      flex: 1;
    }

    .detalle {
      color: #6b7280;
      font-size: 14px;
      margin-top: 5px;
    }

    .borrar {
      width: auto;

      padding:
        6px 11px;

      margin-top: 8px;

      font-size: 13px;

      background:
        #fee2e2;

      color:
        #b91c1c;

      border: none;

      cursor: pointer;
    }

    .vacio {
      color: #6b7280;
      text-align: center;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      padding: 20px;
    }

  </style>

</head>


<body>


<header>

  <h1>
    💰 As contas claras
  </h1>

  <p>
    Economía familiar
  </p>

</header>



<div class="container">


  <!-- MES -->

  <div class="mes">

    <label for="mes">
      Mes
    </label>

    <input
      type="month"
      id="mes"
    >

  </div>



  <!-- RESUMEN GENERAL -->

  <section class="resumen">

    <div class="tarjeta ingresos">

      Ingresos

      <strong id="totalIngresos">
        0,00 €
      </strong>

    </div>


    <div class="tarjeta gastos">

      Gastos

      <strong id="totalGastos">
        0,00 €
      </strong>

    </div>


    <div
      class="tarjeta saldo"
      id="tarjetaSaldo"
    >

      Saldo del mes

      <strong id="saldo">
        0,00 €
      </strong>

    </div>

  </section>



  <!-- NUEVO MOVIMIENTO -->

  <section class="panel">

    <h2>
      ➕ Nuevo movimiento
    </h2>


    <label>
      Fecha
    </label>

    <input
      type="date"
      id="fecha"
    >


    <label>
      Tipo
    </label>

    <select id="tipo">

      <option value="Gasto">
        Gasto
      </option>

      <option value="Ingreso">
        Ingreso
      </option>

    </select>


    <label>
      Persona
    </label>

    <select id="persona">

      <option value="Familia">
        Familia
      </option>

      <option value="Paco">
        Paco
      </option>

      <option value="Mari">
        Mari
      </option>

      <option value="Nere">
        Nere
      </option>

    </select>



    <!-- CATEGORÍAS DE GASTO -->

    <div id="bloqueCategoria">

      <label>
        Categoría
      </label>

      <select id="categoria">

        <option value="Supermercado">
          Supermercado
        </option>

        <option value="Hipoteca">
          Hipoteca
        </option>

        <option value="Luz">
          Luz
        </option>

        <option value="Telefono">
          Telefono
        </option>

        <option value="App tv">
          App tv
        </option>

        <option value="Ropa/calzado">
          Ropa/calzado
        </option>

        <option value="Fiesta">
          Fiesta
        </option>

        <option value="Coches/Moto">
          Coches/Moto
        </option>

        <option value="Salud">
          Salud
        </option>

        <option value="Viajes">
          Viajes
        </option>

        <option value="Tabaco">
          Tabaco
        </option>

        <option value="Seguros">
          Seguros
        </option>

        <option value="Plan de inversión">
          Plan de inversión
        </option>

        <option value="Otros">
          Otros
        </option>

      </select>

    </div>



    <!-- FUENTE DE INGRESO -->

    <div
      id="bloqueFuente"
      class="oculto"
    >

      <label>
        Fuente de ingreso
      </label>

      <select id="fuente">
      </select>

    </div>



    <label>
      Concepto
    </label>

    <input
      type="text"
      id="concepto"
      placeholder="Ej. Mercadona, nómina julio, hipoteca..."
    >


    <label>
      Cantidad (€)
    </label>

    <input
      type="number"
      id="cantidad"
      step="0.01"
      min="0"
      inputmode="decimal"
      placeholder="0,00"
    >


    <button
      class="btn"
      onclick="guardarMovimiento()"
    >

      Guardar movimiento

    </button>

  </section>



  <!-- RESUMEN POR PERSONA -->

  <section class="panel">

    <h2>
      👨‍👩‍👧 Resumen por persona
    </h2>

    <div id="resumenPersonas">
    </div>

  </section>



  <!-- RESUMEN POR CATEGORÍA -->

  <section class="panel">

    <h2>
      📊 Gastos por categoría
    </h2>

    <div id="resumenCategorias">
    </div>

  </section>



  <!-- MOVIMIENTOS -->

  <section class="panel">

    <h2>
      📋 Movimientos
    </h2>

    <div id="listaMovimientos">
    </div>

  </section>


</div>



<footer>

  As contas claras · Datos guardados en este dispositivo

</footer>



<script>


/* ==========================================
   PERSONAS
========================================== */


const personas = [

  "Familia",
  "Paco",
  "Mari",
  "Nere"

];



/* ==========================================
   CATEGORÍAS DE GASTO
========================================== */


const categorias = [

  "Supermercado",
  "Hipoteca",
  "Luz",
  "Telefono",
  "App tv",
  "Ropa/calzado",
  "Fiesta",
  "Coches/Moto",
  "Salud",
  "Viajes",
  "Tabaco",
  "Seguros",
  "Plan de inversión",
  "Otros"

];



/* ==========================================
   FUENTES DE INGRESO
========================================== */


const fuentesIngreso = {

  Paco: [
    "Nómina",
    "Alquiler"
  ],

  Mari: [
    "Nómina",
    "Pensión"
  ]

};



/* ==========================================
   DATOS GUARDADOS
========================================== */


let movimientos =

  JSON.parse(

    localStorage.getItem(
      "asContasClaras"
    )

  ) || [];



/* ==========================================
   FORMATO EURO
========================================== */


const formatoEuro =

  new Intl.NumberFormat(

    "es-ES",

    {

      style:
        "currency",

      currency:
        "EUR"

    }

  );



/* ==========================================
   FORMATEAR VALORES CERO
========================================== */


function importeNormal(
  cantidad
) {

  if (
    Math.abs(cantidad) <
    0.005
  ) {

    return formatoEuro.format(0);

  }


  return formatoEuro.format(
    cantidad
  );

}



function importeIngreso(
  cantidad
) {

  if (
    Math.abs(cantidad) <
    0.005
  ) {

    return formatoEuro.format(0);

  }


  return "+" +
    formatoEuro.format(
      cantidad
    );

}



function importeGasto(
  cantidad
) {

  if (
    Math.abs(cantidad) <
    0.005
  ) {

    return formatoEuro.format(0);

  }


  return "-" +
    formatoEuro.format(
      cantidad
    );

}



/* ==========================================
   FECHAS
========================================== */


function fechaHoy() {

  const hoy =
    new Date();


  const year =
    hoy.getFullYear();


  const month =
    String(
      hoy.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      hoy.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}



function mesActual() {

  return fechaHoy()
    .slice(
      0,
      7
    );

}



document
  .getElementById(
    "fecha"
  )
  .value =
  fechaHoy();



document
  .getElementById(
    "mes"
  )
  .value =
  mesActual();



/* ==========================================
   EVENTOS
========================================== */


document
  .getElementById(
    "tipo"
  )
  .addEventListener(

    "change",

    actualizarFormulario

  );



document
  .getElementById(
    "persona"
  )
  .addEventListener(

    "change",

    actualizarFormulario

  );



document
  .getElementById(
    "mes"
  )
  .addEventListener(

    "change",

    actualizarPantalla

  );



/* ==========================================
   FORMULARIO INGRESO / GASTO
========================================== */


function actualizarFormulario() {


  const tipo =

    document
      .getElementById(
        "tipo"
      )
      .value;



  const personaSelect =

    document
      .getElementById(
        "persona"
      );



  const bloqueCategoria =

    document
      .getElementById(
        "bloqueCategoria"
      );



  const bloqueFuente =

    document
      .getElementById(
        "bloqueFuente"
      );



  const fuente =

    document
      .getElementById(
        "fuente"
      );



  const opcionFamilia =

    personaSelect
      .querySelector(
        'option[value="Familia"]'
      );



  const opcionNere =

    personaSelect
      .querySelector(
        'option[value="Nere"]'
      );



  /* INGRESOS */

  if (
    tipo === "Ingreso"
  ) {


    bloqueCategoria
      .classList
      .add(
        "oculto"
      );


    bloqueFuente
      .classList
      .remove(
        "oculto"
      );


    opcionFamilia.disabled =
      true;


    opcionNere.disabled =
      true;



    if (

      personaSelect.value ===
        "Familia"

      ||

      personaSelect.value ===
        "Nere"

    ) {

      personaSelect.value =
        "Paco";

    }



    const persona =
      personaSelect.value;



    fuente.innerHTML =
      "";



    const fuentes =

      fuentesIngreso[
        persona
      ] || [];



    fuentes.forEach(

      nombre => {


        const opcion =

          document
            .createElement(
              "option"
            );


        opcion.value =
          nombre;


        opcion.textContent =
          nombre;


        fuente
          .appendChild(
            opcion
          );

      }

    );

  }



  /* GASTOS */

  else {


    bloqueCategoria
      .classList
      .remove(
        "oculto"
      );


    bloqueFuente
      .classList
      .add(
        "oculto"
      );


    opcionFamilia.disabled =
      false;


    opcionNere.disabled =
      false;

  }

}



/* ==========================================
   GUARDAR MOVIMIENTO
========================================== */


function guardarMovimiento() {


  const fecha =

    document
      .getElementById(
        "fecha"
      )
      .value;



  const tipo =

    document
      .getElementById(
        "tipo"
      )
      .value;



  const persona =

    document
      .getElementById(
        "persona"
      )
      .value;



  const concepto =

    document
      .getElementById(
        "concepto"
      )
      .value
      .trim();



  const cantidad =

    Number(

      document
        .getElementById(
          "cantidad"
        )
        .value

    );



  const categoria =

    tipo === "Gasto"

      ?

      document
        .getElementById(
          "categoria"
        )
        .value

      :

      "";



  const fuente =

    tipo === "Ingreso"

      ?

      document
        .getElementById(
          "fuente"
        )
        .value

      :

      "";



  if (
    !fecha
  ) {

    alert(
      "Selecciona una fecha."
    );

    return;

  }



  if (

    !cantidad

    ||

    cantidad <= 0

  ) {

    alert(
      "Introduce una cantidad válida."
    );

    return;

  }



  if (

    tipo === "Ingreso"

    &&

    (
      persona === "Familia"

      ||

      persona === "Nere"
    )

  ) {

    alert(
      "Los ingresos solo pueden asignarse a Paco o Mari."
    );

    return;

  }



  const movimiento = {


    id:

      Date
        .now()
        .toString()

      +

      Math
        .random()
        .toString(16)
        .slice(2),


    fecha,

    tipo,

    persona,

    concepto,

    cantidad,

    categoria,

    fuente

  };



  movimientos
    .push(
      movimiento
    );



  guardarDatos();



  document
    .getElementById(
      "concepto"
    )
    .value =
    "";



  document
    .getElementById(
      "cantidad"
    )
    .value =
    "";



  document
    .getElementById(
      "mes"
    )
    .value =

    fecha
      .slice(
        0,
        7
      );



  actualizarPantalla();

}



/* ==========================================
   GUARDAR EN EL DISPOSITIVO
========================================== */


function guardarDatos() {


  localStorage.setItem(

    "asContasClaras",

    JSON.stringify(
      movimientos
    )

  );

}



/* ==========================================
   BORRAR MOVIMIENTO
========================================== */


function borrarMovimiento(
  id
) {


  const confirmar =

    confirm(
      "¿Quieres borrar este movimiento?"
    );



  if (
    !confirmar
  ) {

    return;

  }



  movimientos =

    movimientos.filter(

      movimiento =>

        movimiento.id !== id

    );



  guardarDatos();


  actualizarPantalla();

}



/* ==========================================
   MOVIMIENTOS DEL MES
========================================== */


function movimientosMes() {


  const mes =

    document
      .getElementById(
        "mes"
      )
      .value;



  return movimientos.filter(

    movimiento =>

      movimiento
        .fecha
        .startsWith(
          mes
        )

  );

}



/* ==========================================
   ACTUALIZAR TODA LA PANTALLA
========================================== */


function actualizarPantalla() {


  const datos =
    movimientosMes();



  let ingresos =
    0;


  let gastos =
    0;



  datos.forEach(

    movimiento => {


      if (

        movimiento.tipo ===
        "Ingreso"

      ) {

        ingresos +=
          movimiento.cantidad;

      }


      else {

        gastos +=
          movimiento.cantidad;

      }

    }

  );



  const saldo =
    ingresos -
    gastos;



  document
    .getElementById(
      "totalIngresos"
    )
    .textContent =

    importeNormal(
      ingresos
    );



  document
    .getElementById(
      "totalGastos"
    )
    .textContent =

    importeNormal(
      gastos
    );



  document
    .getElementById(
      "saldo"
    )
    .textContent =

    importeNormal(
      saldo
    );



  const tarjetaSaldo =

    document
      .getElementById(
        "tarjetaSaldo"
      );



  if (
    saldo < 0
  ) {

    tarjetaSaldo
      .classList
      .add(
        "saldo-negativo"
      );

  }


  else {

    tarjetaSaldo
      .classList
      .remove(
        "saldo-negativo"
      );

  }



  mostrarPersonas(
    datos
  );


  mostrarCategorias(
    datos
  );


  mostrarMovimientos(
    datos
  );

}



/* ==========================================
   RESUMEN POR PERSONA
========================================== */


function mostrarPersonas(
  datos
) {


  const contenedor =

    document
      .getElementById(
        "resumenPersonas"
      );



  contenedor.innerHTML =
    "";



  personas.forEach(

    persona => {


      const ingresos =

        datos

          .filter(

            movimiento =>

              movimiento.persona ===
                persona

              &&

              movimiento.tipo ===
                "Ingreso"

          )

          .reduce(

            (
              total,
              movimiento
            ) =>

              total +
              movimiento.cantidad,

            0

          );



      const gastos =

        datos

          .filter(

            movimiento =>

              movimiento.persona ===
                persona

              &&

              movimiento.tipo ===
                "Gasto"

          )

          .reduce(

            (
              total,
              movimiento
            ) =>

              total +
              movimiento.cantidad,

            0

          );



      const div =

        document
          .createElement(
            "div"
          );



      div.className =
        "fila-resumen";



      if (
        persona === "Familia"
      ) {


        div.innerHTML = `

          <strong>
            🏠 Familia
          </strong>

          <span
            class="
              importe-resumen
              ${
                gastos > 0
                  ? "negativo"
                  : "neutro"
              }
            "
          >

            ${importeGasto(
              gastos
            )}

          </span>

        `;

      }


      else {


        const claseIngreso =

          ingresos > 0
            ? "positivo"
            : "neutro";


        const claseGasto =

          gastos > 0
            ? "negativo"
            : "neutro";



        div.innerHTML = `

          <strong>
            ${persona}
          </strong>

          <span
            class="
              importe-resumen
            "
          >

            <span
              class="${claseIngreso}"
            >

              ${importeIngreso(
                ingresos
              )}

            </span>

            ·

            <span
              class="${claseGasto}"
            >

              ${importeGasto(
                gastos
              )}

            </span>

          </span>

        `;

      }



      contenedor
        .appendChild(
          div
        );

    }

  );

}



/* ==========================================
   RESUMEN POR CATEGORÍA
========================================== */


function mostrarCategorias(
  datos
) {


  const contenedor =

    document
      .getElementById(
        "resumenCategorias"
      );



  contenedor.innerHTML =
    "";



  categorias.forEach(

    categoria => {


      const total =

        datos

          .filter(

            movimiento =>

              movimiento.tipo ===
                "Gasto"

              &&

              movimiento.categoria ===
                categoria

          )

          .reduce(

            (
              suma,
              movimiento
            ) =>

              suma +
              movimiento.cantidad,

            0

          );



      const div =

        document
          .createElement(
            "div"
          );



      div.className =
        "fila-resumen";



      const clase =

        total > 0
          ? "negativo"
          : "neutro";



      div.innerHTML = `

        <strong>
          ${categoria}
        </strong>

        <span
          class="
            importe-resumen
            ${clase}
          "
        >

          ${importeGasto(
            total
          )}

        </span>

      `;



      contenedor
        .appendChild(
          div
        );

    }

  );

}



/* ==========================================
   HISTORIAL DE MOVIMIENTOS
========================================== */


function mostrarMovimientos(
  datos
) {


  const contenedor =

    document
      .getElementById(
        "listaMovimientos"
      );



  contenedor.innerHTML =
    "";



  if (
    datos.length === 0
  ) {


    contenedor.innerHTML = `

      <div class="vacio">

        No hay movimientos
        este mes.

      </div>

    `;


    return;

  }



  const ordenados =

    [...datos]
      .sort(

        (
          a,
          b
        ) =>

          b.fecha
            .localeCompare(
              a.fecha
            )

      );



  ordenados.forEach(

    movimiento => {


      const div =

        document
          .createElement(
            "div"
          );



      div.className =
        "movimiento";



      const clase =

        movimiento.tipo ===
          "Ingreso"

          ?
          "positivo"

          :
          "negativo";



      const importe =

        movimiento.tipo ===
          "Ingreso"

          ?

          importeIngreso(
            movimiento.cantidad
          )

          :

          importeGasto(
            movimiento.cantidad
          );



      const detalle =

        movimiento.tipo ===
          "Ingreso"

          ?

          movimiento.fuente

          :

          movimiento.categoria;



      const personaTexto =

        movimiento.persona ===
          "Familia"

          ?

          "🏠 Familia"

          :

          movimiento.persona;



      div.innerHTML = `


        <div class="mov-top">


          <span>

            ${
              movimiento.concepto
              ||
              detalle
            }

          </span>


          <span
            class="${clase}"
          >

            ${importe}

          </span>


        </div>


        <div class="detalle">

          ${movimiento.fecha}

          ·

          ${personaTexto}

          ·

          ${detalle}

        </div>


        <button

          class="borrar"

          onclick="
            borrarMovimiento(
              '${movimiento.id}'
            )
          "

        >

          Eliminar

        </button>


      `;



      contenedor
        .appendChild(
          div
        );

    }

  );

}



/* ==========================================
   INICIAR APP
========================================== */


actualizarFormulario();

actualizarPantalla();


</script>
